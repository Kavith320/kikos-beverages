<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kiosk Admin Login</title>
    <link rel="icon" type="image/png" href="/favicon.ico?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #010103; --accent: #00d4ff; --danger: #ff3e5e; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Outfit', sans-serif; background: var(--bg); display: grid; place-items: center; overflow: hidden; background: url('/assets/login_bg.jpg') center/cover no-repeat; }
        body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.9) 100%); z-index: -1; }
        
        .card { width: 380px; background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; transform: translateY(0); animation: slideUp 0.8s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo { width: 64px; height: 64px; background: var(--accent); border-radius: 12px; margin: 0 auto 24px auto; display: grid; place-items: center; box-shadow: 0 0 20px rgba(0,212,255,0.3); }
        h1 { font-size: 1.5rem; margin: 0 0 8px 0; color: #fff; font-weight: 600; }
        p { color: #8c8c9e; font-size: 0.9rem; margin-bottom: 32px; }
        
        .field { position: relative; margin-bottom: 20px; text-align: left; }
        .field label { display: block; font-size: 0.75rem; color: #8c8c9e; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 1rem; transition: 0.2s; outline: none; }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); box-shadow: 0 0 10px rgba(0,212,255,0.1); }
        
        button { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #00e5ff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.4); }
        button:active { transform: translateY(0); }
        
        #err { color: var(--danger); font-size: 0.8rem; margin-top: 16px; height: 20px; transition: opacity 0.3s; opacity: 0; }
        
        .footer { position: absolute; bottom: 30px; font-size: 0.7rem; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
        .footer strong { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2zM6 13l3 3 5-5"/></svg>
        </div>
        <h1>Kiosk Admin</h1>
        <p>Sign in to manage your smart display</p>
        
        <div class="field">
            <label>Username</label>
            <input type="text" id="u" placeholder="Enter username" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="p" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
        </div>
        
        <button onclick="login()">SIGN IN</button>
        <div id="err">Invalid credentials</div>
    </div>
    
    <div class="footer">
        POWERED BY <strong>SMART KIOSK AI</strong>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const e = document.getElementById('err');
            
            const r = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            
            if (r.ok) {
                window.location.href = '/';
            } else {
                e.style.opacity = '1';
                setTimeout(() => e.style.opacity = '0', 3000);
            }
        }
    </script>
</body>
</html>
