<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk | Restricted Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.4);
            --surface: rgba(15, 15, 25, 0.7);
            --text: #ffffff;
            --error: #ff3e5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Animated Background Particles */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move-glow 15s infinite alternate ease-in-out;
        }

        @keyframes move-glow {
            0% { transform: translate(-30%, -30%) scale(1); }
            100% { transform: translate(30%, 30%) scale(1.2); }
        }

        .login-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(40px) rotateX(-5deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-dot {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px var(--accent-glow); }
            50% { transform: scale(1.3); box-shadow: 0 0 30px var(--accent-glow); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            font-weight: 400;
            transform: translateX(5px);
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--accent);
            color: #030305;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        #error-msg {
            color: var(--error);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
            min-height: 20px;
            opacity: 0;
            transition: 0.3s;
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Subtle Float Animation for the whole card */
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-dot"></div>
            <h1>Secure Access</h1>
            <p class="subtitle">Kiosk Control Center</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="password" placeholder="••••••••" required autofocus>
            </div>
            
            <button type="submit" class="btn-login" id="login-btn">
                <span>Unlock Terminal</span>
            </button>
        </form>

        <div id="error-msg">Incorrect credentials. Try again.</div>

        <div class="footer-note">System version 4.2.0-stable</div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const error = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            btn.innerHTML = 'Decrypting...';
            btn.disabled = true;
            error.style.opacity = '0';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    btn.innerHTML = 'Authorized';
                    btn.style.background = '#22c55e';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    throw new Error('Unauthorized');
                }
            } catch (err) {
                btn.innerHTML = 'Unlock Terminal';
                btn.disabled = false;
                error.style.opacity = '1';
                // Shake animation
                document.querySelector('.login-card').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 400 });
            }
        });
    </script>
</body>
</html>
